version: "0.4.0"
description: Header-only graphics library for RGB565/RGB666/RGB888/monochrome surfaces, sprites, fonts, touch/gesture input, and simple 3D wireframe rendering.
url: https://github.com/pschatzmann/TinyGPU

# Some headers (Input/TouchDriverArduino.h, Boards/LCDBoardsESP32.h, ...)
# call into the Arduino API (delay/pinMode/digitalWrite/SPIClass/TwoWire).
# That's no longer a hard requirement: TinyGPU/Emulation/EmulationIDF.h
# uses arduino-esp32 automatically when it's present in the build, and
# falls back to a small ESP-IDF-native emulation of that surface
# otherwise. Uncomment this only if you want the real arduino-esp32
# implementation instead of the fallback (CMakeLists.txt picks it up
# automatically once it's part of the build either way):
#dependencies:
#  espressif/arduino-esp32: "^3.3.8"
